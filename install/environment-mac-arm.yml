# Conda environment for Apple Silicon (M1/M2/M3/M4) — ARM64
#
# Create : conda env create -f environment-mac-arm.yml
# Activate: conda activate pydsft
#
# After activation, run the post-install steps at the bottom of this file.
#
# NOTE: Java 17 is the latest LTS officially supported by PySpark 3.5.x.

name: pydsft

channels:
  - conda-forge
  - defaults

dependencies:
  # ── Runtime ────────────────────────────────────────────────────────────────
  - python=3.11
  - openjdk=17          # LTS; PySpark 3.5.x officially supports Java 8/11/17

  # ── Jupyter stack ──────────────────────────────────────────────────────────
  - jupyterlab=4
  - notebook
  - ipykernel
  - ipywidgets
  - ipympl>=0.9          # enables %matplotlib widget; must be compatible with jupyterlab major version

  # ── Core scientific stack (ARM-native wheels from conda-forge) ─────────────
  - numpy
  - pandas
  - matplotlib
  - seaborn
  - scipy
  - scikit-learn        # conda-forge ships a proper ARM64 wheel
  - pillow
  - imageio
  - statsmodels
  - python-dotenv

  # ── pip-installed packages ─────────────────────────────────────────────────
  - pip
  - pip:
    # TensorFlow — standard wheel supports Apple Silicon natively (CPU).
    # tensorflow-metal adds Metal GPU acceleration but must exactly match
    # the TF version that pip resolves. To add it after install:
    #   1. pip show tensorflow | grep Version
    #   2. pip install tensorflow-metal==<matching version>
    - tensorflow

    # Big Data
    - pyspark==3.5.0

    # NLP
    - spacy
    - wordcloud
    - textblob
    - nltk

    # Geo / mapping
    - folium
    - geopy

    # Visualisation / dashboards
    - plotly
    - dash

    # Databases / networking
    - pymongo
    - dnspython

    # Social / messaging
    - pubnub
    - "Mastodon.py>=2.2.1"
    - tweet-preprocessor

    # AI / translation / moderation
    - openai
    - deepl
    - better_profanity

    # Audio
    - playsound3

# ── Post-install steps (run once after `conda activate pydsft`) ─────────────
#
#   python -m spacy download en_core_web_sm
#   python -m spacy download en_core_web_md
#   python -m spacy download en_core_web_lg
#
#   python -m textblob.download_corpora
#
#   python -c "import nltk; nltk.download('punkt'); nltk.download('wordnet'); nltk.download('stopwords')"
#
#   # Verify key packages
#   python -c "import sklearn; import tensorflow as tf; import pyspark; print('All OK')"
